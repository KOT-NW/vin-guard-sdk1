[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vin-guard-sdk"
version = "0.3.2"
description = "Sync and async AI Gateway clients with routing metadata and dashboard reads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
langchain = ["langchain-core>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_gateway = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real control-plane + gateway smoke test (opt-in via AIGW_SMOKE=1)",
]
